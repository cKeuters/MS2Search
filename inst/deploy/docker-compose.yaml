services:
  dreams:
    build: ./dreams-service
    restart: unless-stopped
    cpus: 3
    mem_limit: 8g
    
  ms2search:
    build: .  
    restart: unless-stopped
    cpus: 3
    mem_limit: 8g
    ports:
      - "80:80"  
    environment:
      - DREAMS_URL=http://dreams:8000
    depends_on:
      - dreams
